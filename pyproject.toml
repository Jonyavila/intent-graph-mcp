[project]
name = "intent-graph-mcp"
version = "0.1.0"
description = "Servidor MCP y CLI para predicción arquitectónica de software basada en grafos."
readme = "README.md"
authors = [
    { name = "Jonathan", email = "bravojony484@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1.6",
    "mcp[cli]>=2.3.0",
    "networkx>=3.4.2",
    "tree-sitter>=0.26.1",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
intent-graph = "build_graph:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["build_graph", "server"]